name: Pruebas

on:
  push:
  pull_request:

jobs:
  sqlite:
    name: Pruebas (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (pyflakes)
        run: python -m pyflakes app.py models.py pos_routes.py operacion_routes.py servicio_routes.py compras_routes.py nomina_routes.py alertas.py propinas_routes.py menu_routes.py respaldo.py restaurar_respaldo.py reportes_routes.py offline_routes.py
      - name: Pruebas
        run: python -m pytest

  postgres:
    # Igual que producción (Neon): ALTER ... IF NOT EXISTS, FOR UPDATE SKIP LOCKED, ON CONFLICT, advisory locks.
    # Base vacía y desechable creada por GitHub Actions; NUNCA apuntar a la base real.
    # Mismas versiones que producción: Python de Render (PYTHON_VERSION) y PostgreSQL de Neon.
    name: Pruebas (como producción - Python 3.11 + PostgreSQL 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pruebas
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: comensal_pruebas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pruebas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PRUEBAS_DATABASE_URL: postgresql://pruebas:pruebas@localhost:5432/comensal_pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Pruebas
        run: python -m pytest
