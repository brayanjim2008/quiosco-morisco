<meta name="csrf-token" content="{{ csrf_token() }}">
<script>
  // Protección CSRF: agrega el token de la sesión a cada fetch (POST/PUT/DELETE al mismo sitio)
  // y a cada formulario POST, sin tener que modificar cada llamada de la página.
  (function () {
    var TOKEN = document.querySelector('meta[name="csrf-token"]').content;
    var fetchOriginal = window.fetch;
    window.fetch = function (input, init) {
      init = init || {};
      var metodo = String(init.method || (input && input.method) || 'GET').toUpperCase();
      var url = typeof input === 'string' ? input : String((input && input.url) || input || '');
      var mismoSitio = !/^https?:\/\//i.test(url) || url.indexOf(window.location.origin) === 0;
      if (mismoSitio && metodo !== 'GET' && metodo !== 'HEAD') {
        var headers = new Headers(init.headers || ((typeof Request !== 'undefined' && input instanceof Request) ? input.headers : undefined));
        headers.set('X-CSRFToken', TOKEN);
        init = Object.assign({}, init, { headers: headers });
      }
      return fetchOriginal.call(this, input, init);
    };
    function agregarToken(form) {
      if (String(form.method || '').toLowerCase() !== 'post') return;
      if (form.querySelector('input[name="csrf_token"]')) return;
      var inp = document.createElement('input');
      inp.type = 'hidden'; inp.name = 'csrf_token'; inp.value = TOKEN;
      form.appendChild(inp);
    }
    document.addEventListener('submit', function (e) {
      if (e.target && e.target.tagName === 'FORM') agregarToken(e.target);
    }, true);
    var submitOriginal = HTMLFormElement.prototype.submit;
    HTMLFormElement.prototype.submit = function () { agregarToken(this); return submitOriginal.call(this); };
    // Botones "Salir" (<a href="/logout">): se cierra sesión por POST con token, no por un enlace GET.
    document.addEventListener('click', function (e) {
      // closest() sube desde el <i> del ícono hasta el <a>, así funciona aunque se toque el ícono.
      var a = e.target && e.target.closest ? e.target.closest('a[href="/logout"]') : null;
      if (!a) return;
      e.preventDefault();
      var f = document.createElement('form');
      f.method = 'post'; f.action = '/logout'; f.style.display = 'none';
      document.body.appendChild(f);
      f.submit();  // el submit parcheado arriba le agrega el csrf_token
    }, true);
  })();
</script>
