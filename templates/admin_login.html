<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Empleados - Quiosco Morisco</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; background-color: #13423b; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; padding: 15px; }
        .login-box { background: #fdfaf6; padding: 35px 30px; border-radius: 18px; box-shadow: 0 15px 35px rgba(0,0,0,0.35); width: 100%; max-width: 360px; border: 2px solid #c98246; }
        h2 { text-align: center; color: #13423b; font-weight: 800; margin-bottom: 8px; }
        label { font-weight: bold; font-size: 13px; color: #444; text-transform: uppercase; }
        input { width: 100%; padding: 12px; margin: 6px 0 16px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 13px; background: #13423b; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        button:hover { background: #c98246; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔑 Control de Mando</h2>
        <p class="text-center text-muted small mb-3">La sesión quedará guardada automáticamente en este dispositivo.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-danger py-2 text-center small fw-bold">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form action="{{ url_for('admin_login') }}" method="POST">
            <label>Usuario:</label>
            <input type="text" name="username" placeholder="Ingresa tu usuario" required autofocus>
            <label>Contraseña:</label>
            <input type="password" name="password" placeholder="••••••••" required>
            <button type="submit">Entrar al Sistema</button>
        </form>
        <div style="text-align: center; margin-top: 18px;">
            <a href="{{ url_for('index') }}" style="color: #13423b; text-decoration: none; font-size: 14px; font-weight: bold;">← Volver al Menú del Restaurante</a>
        </div>
    </div>
</body>
</html>
