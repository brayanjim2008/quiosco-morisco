<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Platillo</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #f4f6f9; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #555; }
        .form-control { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-guardar { background-color: #ff9800; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }
        .btn-cancelar { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; }
        .foto-actual { width: 100px; border-radius: 8px; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: #2c3e50; text-align: center;">✏️ Editar Platillo</h2>
    
    <!-- enctype es vital para poder subir fotos -->
    <form action="{{ url_for('editar_producto', id=producto.id) }}" method="POST" enctype="multipart/form-data">
        
        <div class="form-group">
            <label>Nombre del Platillo:</label>
            <input type="text" name="nombre" class="form-control" value="{{ producto.nombre }}" required>
        </div>

        <div class="form-group">
            <label>Categoría Actual: <strong>{{ producto.categoria }}</strong></label>
            <select name="categoria" class="form-control" required>
                <option value="{{ producto.categoria }}">Mantener: {{ producto.categoria }}</option>
                <option value="Desayunos y Más para Comer">Desayunos y Más para Comer</option>
                <option value="Entradas">Entradas</option>
                <option value="Sándwiches Bistró">Sándwiches Bistró</option>
                <option value="Hamburguesas">Hamburguesas</option>
                <option value="Antojitos">Antojitos</option>
                <option value="Platillos Bistró">Platillos Bistró</option>
                <option value="Postres">Postres</option>
                <option value="Bebidas Calientes">Bebidas Calientes</option>
                <option value="Bebidas Frías">Bebidas Frías</option>
                <option value="Frappés">Frappés</option>
                <option value="Infusiones">Infusiones</option>
                <option value="Jugos Naturales">Jugos Naturales</option>
                <option value="Aguas Naturales">Aguas Naturales</option>
                <option value="Refrescos">Refrescos</option>
            </select>
        </div>

        <div class="form-group">
            <label>Precio ($):</label>
            <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio }}" required>
        </div>

        <div class="form-group">
            <label>Descripción:</label>
            <textarea name="descripcion" class="form-control" rows="3">{{ producto.descripcion }}</textarea>
        </div>

        <div class="form-group">
            <label>Actualizar Foto (Deja vacío para mantener la actual):</label>
            {% if producto.imagen_url %}
                <img src="{{ producto.imagen_url }}" class="foto-actual">
            {% endif %}
            <input type="file" name="foto" class="form-control" accept="image/*">
        </div>

        <button type="submit" class="btn-guardar">Guardar Cambios</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn-cancelar">Cancelar y Volver</a>
    </form>
</div>

</body>
</html>
