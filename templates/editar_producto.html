<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Platillo</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #f4f6f9; padding: 40px 20px; }
        .container { max-width: 700px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        label { font-weight: 700; margin-bottom: 5px; color: #444; font-size: 14px;}
        .btn-guardar { background-color: #ff9800; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 25px; transition: 0.3s; }
        .btn-guardar:hover { background-color: #e68a00; }
        .btn-cancelar { display: block; text-align: center; margin-top: 15px; color: #7f8c8d; text-decoration: none; font-weight: bold; }
        .foto-actual { width: 120px; border-radius: 8px; margin-bottom: 10px; display: block; border: 2px solid #eee; }
        .seccion-titulo { border-bottom: 2px solid #ff9800; padding-bottom: 8px; margin-bottom: 20px; color: #2c3e50; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h3 class="seccion-titulo text-center">✏️ Editar Platillo: {{ producto.nombre }}</h3>
    
    <div class="alert alert-info py-2 small text-center fw-bold mb-3">
        🤖 Si borras el texto en inglés y das clic fuera de la caja en español, se volverá a traducir automáticamente.
    </div>

    <form action="{{ url_for('editar_producto', id=producto.id) }}" method="POST" enctype="multipart/form-data">
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label>Nombre del Platillo (Español):</label>
                <input type="text" name="nombre" id="edit_nombre_es" onblur="traducirElemento('edit_nombre_es', 'edit_nombre_en')" class="form-control" value="{{ producto.nombre }}" required>
            </div>
            <div class="col-md-6">
                <label class="text-primary">Nombre del Platillo (Inglés):</label>
                <input type="text" name="nombre_en" id="edit_nombre_en" class="form-control border-primary" value="{{ producto.nombre_en or '' }}" placeholder="Ej. Cappuccino">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label>Descripción (Español):</label>
                <textarea name="descripcion" id="edit_desc_es" onblur="traducirElemento('edit_desc_es', 'edit_desc_en')" class="form-control" rows="3">{{ producto.descripcion }}</textarea>
            </div>
            <div class="col-md-6">
                <label class="text-primary">Descripción (Inglés):</label>
                <textarea name="descripcion_en" id="edit_desc_en" class="form-control border-primary" rows="3" placeholder="Ingredients...">{{ producto.descripcion_en or '' }}</textarea>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label>Precio ($):</label>
                <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto.precio }}" required>
            </div>
            <div class="col-md-6">
                <label>Categoría Actual: <strong>{{ producto.categoria }}</strong></label>
                <select name="categoria" class="form-select" required>
                    <option value="{{ producto.categoria }}">Mantener: {{ producto.categoria }}</option>
                    {% for cat in categorias %}
                        {% if cat.nombre != producto.categoria %}
                        <option value="{{ cat.nombre }}">{{ cat.nombre }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="d-flex gap-4 p-3 mb-3 bg-light rounded border">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="destacado" id="destacado_edit" {% if producto.destacado %}checked{% endif %}>
                <label class="form-check-label text-warning fw-bold" for="destacado_edit">⭐ Destacar en Inicio (Favoritos)</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="agotado" id="agotado_edit" {% if producto.agotado %}checked{% endif %}>
                <label class="form-check-label text-danger fw-bold" for="agotado_edit">❌ Marcar como Agotado</label>
            </div>
        </div>

        <div class="mb-3">
            <label>Actualizar Foto (Deja vacío para mantener la actual):</label>
            {% if producto.imagen_url %}
                <img src="{{ producto.imagen_url }}" class="foto-actual">
            {% endif %}
            <input type="file" name="foto" class="form-control" accept="image/*">
        </div>

        <button type="submit" class="btn-guardar">Guardar Cambios</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn-cancelar">← Cancelar y Volver al Panel</a>
    </form>
</div>

<script>
    async function traducirElemento(origen_id, destino_id) {
        let origen = document.getElementById(origen_id);
        let destino = document.getElementById(destino_id);
        if (!origen.value || destino.value) return; 
        destino.placeholder = "🤖 Traduciendo...";
        try {
            let res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=en&dt=t&q=${encodeURIComponent(origen.value)}`);
            let data = await res.json();
            destino.value = data[0][0][0];
        } catch(e) {
            destino.placeholder = "Error, escribe manual";
        }
    }
</script>

</body>
</html>
